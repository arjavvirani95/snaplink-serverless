name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
        env: { TABLE_NAME: test }
      - run: npx cdk synth -q
        env: { CDK_DEFAULT_REGION: us-east-1 }
